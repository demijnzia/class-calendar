<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Semester Calendar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
:root{
  /* Layout: slim semester header, view switcher bar, one calendar surface, day detail underneath. */
  --bg:#f1f4f9; --surface:#ffffff; --surface-2:#e8edf5; --ink:#141a2b; --muted:#566077; --line:#d6dce8;
  --accent:#2a4ed6; --accent-ink:#ffffff;
  --warn:#f4c542; --warn-ink:#2a2100;
  --danger:#cf3340; --danger-ink:#ffffff;
  --chip-ink:#171d2e; --scrim:rgba(12,16,30,.5);
  --f-display:"Bricolage Grotesque","Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f131d; --surface:#171c29; --surface-2:#20263a; --ink:#e6eaf5; --muted:#9aa4bc; --line:#2a3147;
    --accent:#86a0ff; --accent-ink:#0d1330;
    --warn:#e2b73c; --warn-ink:#231b00;
    --danger:#c8353f; --danger-ink:#ffffff;
    --scrim:rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f131d; --surface:#171c29; --surface-2:#20263a; --ink:#e6eaf5; --muted:#9aa4bc; --line:#2a3147;
  --accent:#86a0ff; --accent-ink:#0d1330;
  --warn:#e2b73c; --warn-ink:#231b00;
  --danger:#c8353f; --danger-ink:#ffffff;
  --scrim:rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;padding-inline:16px;padding-block:20px 40px}
#app{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
button,input,select{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* header */
.top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px}
.ident{min-width:0}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
h1{margin:0;font-family:var(--f-display);font-size:40px;line-height:1.05;font-weight:700;letter-spacing:-.02em;overflow-wrap:anywhere}
.meta{font-family:var(--f-mono);font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

.btn{padding:7px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;line-height:1.3}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:500}
.btn.sq{width:34px;padding:7px 0;text-align:center}
.btn[disabled]{opacity:.4;cursor:default}
.btn.warnbtn{border-color:var(--danger);color:var(--danger)}
a.btn{text-decoration:none;display:inline-block;color:inherit}
.steps{margin:8px 0 12px;padding-left:20px;color:var(--muted);font-size:13px}
.steps li{margin-bottom:3px}
.csvbox{width:100%;height:120px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px}
.link{background:none;border:0;padding:0;color:var(--accent);cursor:pointer;text-decoration:underline}
select,input[type=text],input[type=date],input[type=time]{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0;max-width:100%}

/* bar */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.seg{display:inline-flex;background:var(--surface-2);border-radius:9px;padding:3px;gap:2px}
.tab{border:0;background:none;padding:5px 14px;border-radius:7px;cursor:pointer;color:var(--muted)}
.tab[aria-pressed="true"]{background:var(--surface);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.nav{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.navl{display:flex;flex-direction:column;min-width:150px;text-align:center;line-height:1.25}
.navl .mono{font-size:11px;color:var(--muted)}
.add{margin-left:auto}

/* chips */
.chip{display:inline-block;padding:0 9px;border-radius:999px;font-size:11px;font-weight:500;line-height:1.7;background:var(--c);color:var(--chip-ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:4px;min-width:0}
.chipbtn{background:none;border:0;padding:2px;border-radius:999px;cursor:pointer}
.chipbtn .chip{font-size:12px;padding:0 11px}
.chipbtn[aria-pressed="false"]{opacity:.4}
.chipbtn.pick[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.chipbtn.pick[aria-pressed="false"]{opacity:.65}

/* month */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{display:inline-block;width:14px;height:10px;border-radius:3px}
.sw.danger{background:var(--danger)}.sw.warn{background:var(--warn)}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.mh{background:var(--surface-2);padding:6px 4px;text-align:center;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.day{background:var(--surface);min-height:108px;padding:4px;display:flex;flex-direction:column;gap:3px;cursor:pointer;min-width:0}
.day:hover{background:var(--surface-2)}
.day.out{background:var(--surface-2)}
.day.out .n{opacity:.5}
.day.sel{box-shadow:inset 0 0 0 2px var(--accent)}
.day .n{align-self:flex-start;font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:999px;font-variant-numeric:tabular-nums;color:var(--muted)}
.day.today .n{background:var(--accent);color:var(--accent-ink);font-weight:500}
.ev{display:flex;align-items:center;gap:3px;padding:2px 3px;border-radius:6px;background:var(--surface-2);font-size:11px;min-width:0;overflow:hidden}
.day.out .ev{background:var(--surface)}
.ev .chip{flex:0 1 auto;font-size:10px;padding:0 6px;line-height:1.6}
.ev .t{flex:1 1 0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ev.warn{background:var(--warn);color:var(--warn-ink)}
.ev.danger{background:var(--danger);color:var(--danger-ink)}
.ev.past{opacity:.5}
.more{font-size:11px;color:var(--muted);padding-left:3px}

/* panels */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.panel-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.panel-h h2{margin:0;font-family:var(--f-display);font-size:18px;font-weight:600}
.rel{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.drow,.wev,.lrow{display:flex;width:100%;text-align:left;background:none;border:0;cursor:pointer}
.drow{align-items:center;gap:10px;padding:9px 6px;border-top:1px solid var(--line);flex-wrap:wrap}
.drow:hover,.lrow:hover{background:var(--surface-2)}
.drow .time,.wev .time{font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.none{color:var(--muted);font-size:13px;padding:6px 0}

/* week */
.wgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.wday{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;min-width:0;display:flex;flex-direction:column;gap:8px}
.wday.today{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.wday.out{background:var(--surface-2)}
.wday header{display:flex;align-items:baseline;gap:6px}
.wd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500}
.wn{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1}
.mini{margin-left:auto;border:1px solid var(--line);background:var(--surface);border-radius:6px;width:24px;height:24px;cursor:pointer;line-height:1}
.wevs{display:flex;flex-direction:column;gap:6px;min-width:0}
.wev{flex-direction:column;gap:4px;padding:7px 8px;background:var(--surface-2);border-radius:8px;min-width:0}
.wev:hover{outline:1px solid var(--muted)}
.wday.out .wev{background:var(--surface)}
.wt{font-size:13px;overflow-wrap:anywhere}

/* list */
.filters{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.check{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.lgrp h3{margin:0;padding:8px 6px;font-family:var(--f-display);font-size:15px;font-weight:600;border-bottom:1px solid var(--line)}
.lrow{display:grid;grid-template-columns:104px minmax(0,1fr) auto;gap:12px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line)}
.lrow.past{opacity:.55}
.ld{font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums}
.ld b{font-weight:500;font-size:13px}
.lm{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;min-width:0}
.lt{overflow-wrap:anywhere}
.lnk{margin-left:4px;color:var(--accent);font-family:var(--f-mono)}
.lr{font-family:var(--f-mono);font-size:12px;color:var(--muted);white-space:nowrap}

.note{background:var(--surface);border:1px dashed var(--muted);border-radius:12px;padding:14px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
.note p{margin:0;max-width:60ch}
.foot{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px max(16px,env(safe-area-inset-bottom,0px));z-index:10}
.sheet{background:var(--surface);color:var(--ink);width:min(540px,100%);max-height:100%;overflow:auto;border-radius:14px;padding:18px;border:1px solid var(--line)}
.sheet h2{margin:0 0 12px;font-family:var(--f-display);font-size:22px;font-weight:700}
.sheet h3{margin:16px 0 6px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:500}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;min-width:0}
.field>label,.lab{font-size:12px;color:var(--muted);font-weight:500}
.row2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.hint{font-size:12px;color:var(--muted);min-height:1em}
.err{color:var(--danger);font-size:13px;min-height:1.2em;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.actions .sp{flex:1}
.trow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:7px 0;border-top:1px solid var(--line)}
.trow .chip{font-size:12px;padding:0 11px}
.trow code{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.trow .cnt{font-size:12px;color:var(--muted);margin-left:auto}
.addrow{display:flex;gap:8px;margin-top:8px}
.addrow input{flex:1}

@media (max-width:900px){
  .wgrid{grid-template-columns:1fr}
  .wday{display:grid;grid-template-columns:70px minmax(0,1fr);align-items:start}
  .wday header{flex-direction:column;align-items:flex-start;gap:2px}
  .mini{margin-left:0;margin-top:4px}
}
@media (max-width:640px){
  h1{font-size:32px}
  select,input[type=text],input[type=date],input[type=time]{font-size:16px}
  .day{min-height:78px;padding:3px 2px}
  .ev{padding:1px 2px;font-size:10px}
  .ev .t{display:none}
  .ev.has-cls .cat{display:none}
  .ev .chip{font-size:10px;padding:0 5px}
  .mh{font-size:10px;letter-spacing:0}
  .lrow{grid-template-columns:78px minmax(0,1fr)}
  .lr{grid-column:2}
  .add{margin-left:0}
  .navl{min-width:120px}
}
@media (prefers-reduced-motion:no-preference){
  .btn,.day,.tab{transition:background-color .12s,border-color .12s}
}
html{color-scheme:light}body{margin:0}
/* readability + filters */
body{font-size:15px}
.chip{font-size:13px;padding:1px 11px;line-height:1.5}
.chipbtn .chip,.trow .chip,.fchip .chip{font-size:14px;padding:2px 12px}
.ev{flex-wrap:wrap;align-items:flex-start;gap:3px;padding:3px 4px;font-size:13px}
.ev .chip{flex:0 1 auto;font-size:12px;padding:0 8px;line-height:1.6}
.ev .t{flex:1 1 100%;min-width:0;white-space:normal;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;line-height:1.35}
.day{min-height:130px}
.day .n,.mh,.more,.wd,.legend,.rel,.hint,.meta,.ld,.lr,.time{font-size:13px}
.eyebrow{font-size:12px}
.fbar{display:flex;flex-direction:column;gap:8px}
.frow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center}
.frow input[type=text]{flex:1 1 220px;max-width:360px}
.fchips{display:flex;flex-wrap:wrap;gap:4px}
.fchip{background:none;border:0;padding:2px;border-radius:999px;cursor:pointer}
.fchip[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.fchips.has .fchip[aria-pressed="false"]{opacity:.5}
@media (max-width:640px){
  .ev{font-size:11px;padding:2px}
  .ev .chip{font-size:11px;padding:0 6px}
  .ev .t{display:none}
  .day{min-height:84px}
  .mh{font-size:11px}
}

[hidden]{display:none!important}
img{max-width:100%}
</style>

</head>

/* ---------- colors ---------- */
function hslToHex(h,s,l){s/=100;l/=100;var k=function(n){return (n+h/30)%12},a=s*Math.min(l,1-l);
  var f=function(n){return l-a*Math.max(-1,Math.min(k(n)-3,9-k(n),1))};
  var x=function(v){return Math.round(255*v).toString(16).padStart(2,'0')};
  return '#'+x(f(0))+x(f(8))+x(f(4));}
function hexHue(hex){var r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;
  var mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;if(!d)return 0;var h;
  if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;return h<0?h+360:h;}
function pickColor(used){
  var hs=used.map(hexHue),best=null;
  for(var i=0;i<14;i++){var h=Math.random()*360;
    var m=hs.length?Math.min.apply(null,hs.map(function(x){var d=Math.abs(h-x);return Math.min(d,360-d)})):180;
    if(!best||m>best.m)best={h:h,m:m};}
  return hslToHex(best.h,55+Math.random()*20,80+Math.random()*5);
}

  var cls=[];DEF_CLASSES.forEach(function(n){cls.push({name:n,color:pickColor(cats.concat(cls).map(function(c){return c.color}))})});
  return {v:1,semesters:[{id:uid(),name:'115-1',start:'2026-10-01',end:'2027-01-31'}],categories:cats,classes:cls,events:[]};
}

}

function monthView(s,map){

function openImport(){
  var s=curSem();
  var html='<h2>'+tx('impTitle')+'</h2><p class="hint">'+tx('impHint',{sem:esc(s.name)})+'</p>'
    +'<div class="field"><label for="impFile">'+tx('impFile')+'</label><input type="file" id="impFile" accept=".json,application/json"></div>'
    +'<div class="field"><label for="impText">'+tx('impPaste')+'</label><textarea id="impText" class="csvbox"></textarea></div>'
    +'<div class="err" id="impErr" role="alert"></div><div class="hint" id="impOk"></div>'
    +'<div class="actions"><span class="sp"></span><button class="btn" data-s="close">'+tx('close')+'</button><button class="btn primary" data-s="go">'+tx('impGo')+'</button></div>';
  openSheet(html,function(a,b){
    if(a==='close'){closeSheet();return}
    $('#impErr').textContent='';$('#impOk').textContent='';
    var data;
    try{data=JSON.parse($('#impText').value);if(!data||!Array.isArray(data.events))throw 0}catch(e){$('#impErr').textContent=tx('eImp');return}
    var used=function(){return state.categories.concat(state.classes).map(function(x){return x.color})};
    (data.categories||[]).forEach(function(c){
      if(c&&c.name&&!catOf(c.name))state.categories.push({name:c.name,color:pickColor(used()),urgent:c.urgent!==false,plain:!!c.plain});
    });
    var have={};state.events.forEach(function(e){if(e.sem===s.id)have[[e.date,e.time||'',e.cat,e.cls||'',e.title||''].join('|')]=e});
    var added=0,upd=0,dup=0,out=0;
    data.events.forEach(function(e){
      if(!e||!/^\d{4}-\d{2}-\d{2}$/.test(e.date||'')||!e.cat)return;
      if(e.date<s.start||e.date>s.end){out++;return}
      if(!catOf(e.cat))state.categories.push({name:e.cat,color:pickColor(used()),urgent:true,plain:!e.cls});
      var key=[e.date,e.time||'',e.cat,e.cls||'',e.title||''].join('|');
      if(have[key]){var o=have[key];if(safeUrl(e.url)&&!o.url){o.url=e.url;upd++}else dup++;return}
      if(e.cls)ensureClass(e.cls);
      var ne={id:uid(),sem:s.id,date:e.date,time:e.time||'',cat:e.cat,cls:e.cls||'',title:e.title||'',url:safeUrl(e.url)};state.events.push(ne);have[key]=ne;added++;
    });
    if(added||upd||data.categories){save();render()}
    $('#impOk').textContent=tx('impDone',{n:added,u:upd,d:dup,o:out,sem:s.name});
  });
  $('#impFile').addEventListener('change',function(ev){
    var f=ev.target.files&&ev.target.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){$('#impText').value=String(r.result)};r.readAsText(f,'utf-8');
  });
}

/* ---------- Google Calendar export ---------- */
function gSubject(e){var c=e.cls?e.cls+' '+e.cat:e.cat;return e.title?c+' – '+e.title:c}
function gDate(ds){var p=ds.split('-');return p[1]+'/'+p[2]+'/'+p[0]}
function gTime(d){var h=d.getHours(),ap=h>=12?'PM':'AM';h=h%12||12;return h+':'+pad(d.getMinutes())+' '+ap}
function startDt(e){var a=e.date.split('-').map(Number),t=e.time.split(':').map(Number);return new Date(a[0],a[1]-1,a[2],t[0],t[1])}
function csvCell(v){v=String(v==null?'':v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function semName(id){var s=state.semesters.find(function(x){return x.id===id});return s?s.name:''}
function toCsv(list){
  var rows=[['Subject','Start Date','Start Time','End Date','End Time','All Day Event','Description','Location','Private']];
  list.forEach(function(e){
    var desc=tx('csvDesc',{sem:semName(e.sem)})+(safeUrl(e.url)?'\n'+e.url:'');
    if(e.time){var a=startDt(e),b=new Date(a.getTime()+36e5);rows.push([gSubject(e),gDate(e.date),gTime(a),gDate(fmt(b)),gTime(b),'False',desc,'','False'])}
    else rows.push([gSubject(e),gDate(e.date),'',gDate(e.date),'','True',desc,'','False']);
  });
  return rows.map(function(r){return r.map(csvCell).join(',')}).join('\r\n');
}
function gcalUrl(e){
  var cmp=function(d){return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())};
  var dates;
  if(e.time){var a=startDt(e),b=new Date(a.getTime()+36e5);dates=cmp(a)+'T'+pad(a.getHours())+pad(a.getMinutes())+'00/'+cmp(b)+'T'+pad(b.getHours())+pad(b.getMinutes())+'00'}
  else dates=e.date.replace(/-/g,'')+'/'+addDays(e.date,1).replace(/-/g,'');
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(gSubject(e))+'&dates='+dates+'&details='+encodeURIComponent(tx('csvDesc',{sem:semName(e.sem)})+(safeUrl(e.url)?'\n'+e.url:''));
}
function openExport(){
  var s=curSem();
  var pick=function(){
    var up=$('#xScope').value==='up',t=today();
    return semEvents().filter(function(e){return !up||e.date>=t});
  };
  var html='<h2>'+tx('xTitle')+'</h2>'
    +'<div class="field"><label for="xScope">'+tx('xScope',{sem:esc(s.name)})+'</label><select id="xScope"><option value="all">'+tx('xAll')+'</option><option value="up">'+tx('xUp')+'</option></select><div class="hint" id="xCount"></div></div>'
    +'<p class="hint">'+tx('xHint')+'</p>'
    +'<ol class="steps"><li>'+tx('xs1')+'</li><li>'+tx('xs2')+'</li><li>'+tx('xs3',{sem:esc(s.name)})+'</li></ol>'
    +'<div id="xFallback"></div><div class="err" id="xErr" role="alert"></div>'
    +'<div class="actions"><span class="sp"></span><button class="btn" data-s="close">'+tx('close')+'</button><button class="btn primary" data-s="dl" id="xDl">'+tx('xDl')+'</button></div>';
  var csvText=function(){return toCsv(pick())};
  var count=function(){var n=pick().length;$('#xCount').textContent=tx('xCount',{c:nev(n)});$('#xDl').disabled=!n;$('#xErr').textContent=n?'':tx('xNone')};
  openSheet(html,function(a){
    if(a==='close'){closeSheet();return}
    if(a!=='dl')return;
    var cl=window.claude;
    if(!cl||!cl.use){blobSave();return}
    cl.use('downloads').then(function(dl){
      if(!dl){showFallback();return}
      return dl.save({filename:s.name+'-calendar.csv',data:csvText()}).then(function(){$('#xErr').textContent=''},function(err){
        if(err&&err.code==='declined')return;
        $('#xErr').textContent=tx('xNoSave');showFallback();
      });
    }).catch(showFallback);
  });
  function blobSave(){
    try{
      var url=URL.createObjectURL(new Blob(['\ufeff'+csvText()],{type:'text/csv;charset=utf-8'}));
      var a=document.createElement('a');a.href=url;a.download=s.name+'-calendar.csv';document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url)},1000);
    }catch(e){showFallback()}
  }
  function showFallback(){
    var box=$('#xFallback');if(!box||box.firstChild)return;
    box.innerHTML='<div class="field"><label for="xCsv">'+tx('xCopy',{file:esc(s.name)+'-calendar.csv'})+'</label><textarea id="xCsv" class="csvbox" readonly></textarea></div>';
    var ta=$('#xCsv');ta.value=csvText();ta.focus();ta.select();
  }
  $('#xScope').addEventListener('change',function(){var b=$('#xFallback');if(b)b.innerHTML='';count()});
  count();
}

/* ---------- samples ---------- */
function loadSamples(){
  var s=curSem(),base=clamp(today(),s.start,s.end),mon=ws(base);
  DEF_CLASSES.forEach(ensureClass);
  var add=function(date,cat,cls,title,time){if(date<s.start||date>s.end)return;state.events.push({id:uid(),sem:s.id,date:date,time:time||'',cat:cat,cls:cls,title:title,sample:true})};
  for(var w=0;w<4;w++)[1,3].forEach(function(o){add(addDays(mon,w*7+o),'上課天',DEF_CLASSES[0],tx('sLecture'),'10:10')});
  add(addDays(base,3),CLUB,'',tx('sClub'),'18:30');
  add(addDays(base,6),'個人報告',DEF_CLASSES[1],tx('sCase'));
  add(addDays(base,11),'考試',DEF_CLASSES[0],tx('sMid'),'09:00');
  add(addDays(base,19),'分組報告',DEF_CLASSES[2],tx('sGroup'),'14:00');
  add(addDays(base,70),'期末報告',DEF_CLASSES[4],tx('sFinal'));
  save();render();
}

/* ---------- events ---------- */
function shift(dir){
  var s=curSem();
  if(ui.view==='month'){var d=parse(ui.cursor.slice(0,7)+'-01');d.setMonth(d.getMonth()+dir);ui.cursor=clamp(fmt(d),s.start,s.end)}
  else ui.cursor=clamp(addDays(ui.cursor,7*dir),s.start,s.end);
  ui.sel=ui.cursor;
}
$('#app').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='view'){ui.view=b.dataset.v;render()}
  else if(a==='prev'){shift(-1);render()}
  else if(a==='next'){shift(1);render()}
  else if(a==='today'){resetNav();render()}
  else if(a==='day'){
    ui.sel=b.dataset.d;render();
    if(window.matchMedia('(max-width:640px)').matches){var p=$('#dayPanel');if(p)p.scrollIntoView({block:'nearest',behavior:'smooth'})}
  }
  else if(a==='add'){if(canEdit())openEvent(null,b.dataset.d)}
  else if(a==='edit'){if(canEdit())openEvent(b.dataset.id);else openEventView(b.dataset.id)}
  else if(a==='sem-edit'){if(canEdit())openSem(curSem().id)}
  else if(a==='sem-new'){if(canEdit())openSem(null)}
  else if(a==='tags'){if(canEdit())openTags()}
  else if(a==='import'){if(canEdit())openImport()}
  else if(a==='export')openExport();
  else if(a==='lang'){setLang(b.dataset.l);render()}
  else if(a==='unlock')openUnlock();
  else if(a==='lock')lockAdmin();
  else if(a==='sample'){if(canEdit())loadSamples()}
  else if(a==='unsample'){if(canEdit())state.events=state.events.filter(function(e){return !e.sample});save();render()}
  else if(a==='fcat'){var n=b.dataset.n;if(ui.cats.has(n))ui.cats.delete(n);else ui.cats.add(n);render()}
  else if(a==='clearf'){ui.cats.clear();ui.fcls='';ui.q='';render()}
});
$('#app').addEventListener('keydown',function(ev){
  if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches&&ev.target.matches('.day')){ev.preventDefault();ev.target.click()}
});
var composing=false;
function applyQ(el){ui.q=el.value;var pos=el.selectionStart;render();var n=$('#q');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
$('#app').addEventListener('compositionstart',function(ev){if(ev.target.id==='q')composing=true});
$('#app').addEventListener('compositionend',function(ev){if(ev.target.id==='q'){composing=false;applyQ(ev.target)}});
$('#app').addEventListener('input',function(ev){if(ev.target.id==='q'&&!composing)applyQ(ev.target)});
$('#app').addEventListener('change',function(ev){
  var t=ev.target;
  if(t.id==='semSel'){ui.semId=t.value;resetNav();render()}
  else if(t.id==='fcls'){ui.fcls=t.value;render()}
  else if(t.id==='upOnly'){ui.upOnly=t.checked;render()}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

/* ---------- shared calendar (Supabase) ---------- */
function fetchRow(){
  return cloud.sb.from('calendar').select('data,updated_at').eq('id',1).maybeSingle().then(function(r){if(r.error)throw r.error;return r.data});
}
function refresh(first){
  return fetchRow().then(function(row){
    if(cloud.dirty&&!first)return row;
    if(row&&valid(row.data)){state=row.data;migrate();cloud.lastAt=Date.parse(row.updated_at)}
    else if(admin.on){if(legacy&&!state.events.length&&legacy.events.length)state=legacy;migrate()}
    else{state=makeDefault();migrate()}
    persistLocal();sync='ok';
    if(first||!state.semesters.some(function(x){return x.id===ui.semId})){ui.semId=defaultSem().id;resetNav()}
    render();
    if(!row&&admin.on)writeDb();
    return row;
  }).catch(function(){sync='loadfail';render()});
}
function openUnlock(){
  var html='<h2>'+tx('adminTitle')+'</h2><p class="hint">'+tx('adminHint')+'</p>'
    +'<div class="field"><label for="adPass">'+tx('passcode')+'</label><input type="password" id="adPass" autocomplete="current-password"></div>'
    +'<div class="err" id="adErr" role="alert"></div>'
    +'<div class="actions"><span class="sp"></span><button class="btn" data-s="close">'+tx('cancel')+'</button><button class="btn primary" data-s="go">'+tx('unlock')+'</button></div>';
  openSheet(html,function(a,b){
    if(a==='close'){closeSheet();return}
    var pass=$('#adPass').value;
    if(!pass){$('#adErr').textContent=tx('eNoPass');return}
    $('#adErr').textContent='';b.disabled=true;
    cloud.sb.rpc('check_passcode',{p_pass:pass}).then(function(r){
      b.disabled=false;
      if(r.error){$('#adErr').textContent=r.error.message;return}
      if(r.data!==true){$('#adErr').textContent=tx('eBadPass');return}
      admin.on=true;admin.pass=pass;try{sessionStorage.setItem(ADMIN_KEY,pass)}catch(e){}
      closeSheet();refresh(false);
    },function(){b.disabled=false;$('#adErr').textContent=tx('loadErr')});
  });
  var f=$('#adPass');if(f)try{f.focus()}catch(e){}
}
function lockAdmin(){
  clearTimeout(timer);writeDb();
  writing.then(function(){
    admin.on=false;admin.pass='';try{sessionStorage.removeItem(ADMIN_KEY)}catch(e){}
    cloud.dirty=false;return refresh(true);
  });
}
function initCloud(){
  if(!SHARED||!window.supabase)return;
  cloud.sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
  var saved='';try{saved=sessionStorage.getItem(ADMIN_KEY)||''}catch(e){}
  var check=saved?cloud.sb.rpc('check_passcode',{p_pass:saved}).then(function(r){if(!r.error&&r.data===true){admin.on=true;admin.pass=saved}else{try{sessionStorage.removeItem(ADMIN_KEY)}catch(e){}}},function(){}):Promise.resolve();
  check.then(function(){return refresh(true)});
  document.addEventListener('visibilitychange',function(){
    if(document.visibilityState==='visible'&&!cloud.dirty)refresh(false);
  });
}

ui.semId=defaultSem().id;resetNav();persistLocal();render();initCloud();
})();
</script>
